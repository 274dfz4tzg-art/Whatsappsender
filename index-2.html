<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Lead Sender – WhatsApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#14201a;--mu:#6b7a72;--bd:#e3e9e5;--ac:#16a34a;--ac2:#0e7a38;--act:#fff;--soft:#e8f6ee}
@media(prefers-color-scheme:dark){:root{--bg:#0d1210;--card:#171e1a;--tx:#e9f0ec;--mu:#8a9a91;--bd:#26302a;--ac:#2bd46b;--ac2:#1fae55;--act:#06150c;--soft:#12261a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:23px}
h1{font-size:22px;margin:0}header p{margin:2px 0 0;color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 24px rgba(20,40,30,.06)}
.dz{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:30px 14px;border:2px dashed var(--ac);border-radius:16px;background:var(--soft);cursor:pointer;transition:.15s}
.dz:hover,.dz.over{transform:scale(1.01);border-style:solid}.dz .ic{font-size:34px}.dz span{color:var(--mu);font-size:13px}
button,.go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--act);border:0;border-radius:12px;padding:10px 16px;font:600 14px system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
textarea,input[type=search],input[type=text],select{width:100%;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:130px;resize:vertical;margin:8px 0}
details{margin-top:12px}summary{cursor:pointer;color:var(--mu);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:4px 11px;font-size:13px}.chip.ok{background:var(--soft);color:var(--ac2);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}.grid label{font-size:12px;color:var(--mu)}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar select{width:auto;flex:1}
.prog{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0 12px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row.done{opacity:.4}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.row .t{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mu{color:var(--mu);font-size:13px}
[hidden]{display:none!important}
</style></head><body><main>
<header><div class="logo">💬</div><div><h1>Lead Sender</h1><p>Upload leads → auto-clean → send on WhatsApp</p></div></header>

<section class="card">
<label class="dz" id="dz" for="file"><input type="file" id="file" hidden><div class="ic">📤</div><b>Tap to upload or drop your file</b><span>Excel (.xlsx, .xls) or CSV · cleaned privately in your browser</span></label>
<details><summary>Or paste your list instead</summary><textarea id="paste" placeholder="Ahmed, 0501234567&#10;Sara, +971 55 123 4567"></textarea><button id="pb">Clean pasted list</button></details>
<div class="chips" id="st"></div>
<details id="adj" hidden><summary>Wrong columns? Adjust</summary>
<div class="grid"><div><label>Name</label><select id="mn"></select></div><div><label>Phone</label><select id="m1"></select></div><div><label>Backup phone</label><select id="m2"></select></div><div><label>Default country code</label><input type="text" id="cc" value="971"></div></div>
<button id="rc">Re-clean</button></details>
<details id="badbox" hidden><summary>Skipped rows</summary><div id="bad" class="mu"></div></details>
</section>

<div id="app" hidden>
<section class="card">
<b>Your message</b> <span class="mu">– <code>{name}</code> becomes each first name</span>
<textarea id="msg">Hi {name} 👋

🌿 The FIRST freehold farmhouse in Dubai is here.

✅ Full title deed
✅ Ready for construction
✅ Monthly income + short-term rental returns
✅ Hydroponic farming on your own land

Plots are limited. Want the brochure? Reply YES 🏡</textarea>
<div class="bar"><button id="next">Open next unsent ▶</button>
<select id="mode"><option value="app">WhatsApp app</option><option value="web">WhatsApp Web</option><option value="wa">wa.me (slow)</option></select></div>
</section>
<section class="card">
<div class="mu" id="stats"></div><div class="prog"><i id="pg"></i></div>
<input type="search" id="q" placeholder="Search name or number">
<div class="bar" style="margin:10px 0"><label class="mu"><input type="checkbox" id="hide"> Hide sent</label><span style="flex:1"></span>
<button class="alt" id="dl">Download CSV</button><button class="alt" id="reset">Reset</button></div>
<div id="list"></div>
</section></div>
</main>
<script>
const $=id=>document.getElementById(id);
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let L=ls.get('wa_list',[]),sent=ls.get('wa_sent',{}),hdr=[],data=[];
const say=h=>$('st').innerHTML=h;

/* ---- parsing ---- */
function parseCSV(t){t=t.replace(/^\ufeff/,'');const f=t.split('\n')[0],n=c=>(f.match(new RegExp(c==='\t'?'\\t':'\\'+c,'g'))||[]).length;
 const dl=[['\t',n('\t')],[';',n(';')],[',',n(',')]].sort((a,b)=>b[1]-a[1])[0][0],R=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const h=t[i];
  if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}
  else if(h==='"')q=true;else if(h===dl){r.push(c);c=''}
  else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}
 r.push(c);R.push(r);return R}
function loadXLSX(){return new Promise((ok,no)=>{if(window.XLSX)return ok();
 const u=['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
 (function t(i){if(i>=u.length)return no();const s=document.createElement('script');s.src=u[i];s.onload=ok;s.onerror=()=>t(i+1);document.head.append(s)})(0)})}
async function readFile(f){
 say('<span class="chip">⏳ Reading '+f.name.replace(/</g,'')+'…</span>');
 try{let rows;
  if(/\.(xlsx|xls|xlsm|ods)$/i.test(f.name)){await loadXLSX();
   const wb=XLSX.read(await f.arrayBuffer(),{type:'array',raw:true});
   rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}
  else rows=parseCSV(await f.text());
  handle(rows)}
 catch(e){say('<span class="chip">❌ Couldn’t read that file. Try saving it as CSV, or paste the list below.</span>')}
}
$('file').onchange=e=>{const f=e.target.files[0];if(f)readFile(f);e.target.value=''};
const dz=$('dz');['dragover','dragenter'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readFile(f)});
$('pb').onclick=()=>handle(parseCSV($('paste').value));

/* ---- cleaning ---- */
function normOne(s,cc){let raw=s.trim(),d=raw.replace(/\D/g,'');if(!d)return{e:'no digits'};
 if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0')&&!raw.startsWith('+'))d=cc+d.slice(1);
 else if(cc==='971'&&/^5\d{8}$/.test(d))d='971'+d;
 if(d.startsWith('9710'))d='971'+d.slice(4);
 if(d.startsWith('971')){if(!/^9715\d{8}$/.test(d))return{e:'UAE landline/invalid'}}else if(d.length<10||d.length>15)return{e:'wrong length'};
 if(/(\d)\1{6,}/.test(d)||/1234567890/.test(d))return{e:'fake pattern'};return{p:d}}
function firstName(v){let t=String(v??'').trim();if(!t||t.includes('@'))return'';
 let w=t.split(/\s+/);if(/^(mr|mrs|ms|miss|dr|eng|prof)\.?$/i.test(w[0])&&w[1])w.shift();
 let s=w[0].replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'');
 if(/^[a-z]+$/.test(s)||/^[A-Z]{2,}$/.test(s))s=s[0].toUpperCase()+s.slice(1).toLowerCase();return s.length>20?'':s}
function handle(rows){
 rows=rows.filter(r=>r.some(c=>String(c??'').trim()));
 if(!rows.length)return say('<span class="chip">❌ Nothing found in that file.</span>');
 const dl=rows[0].some(c=>String(c??'').replace(/\D/g,'').length>=8);
 hdr=dl?rows[0].map((_,i)=>'Column '+(i+1)):rows[0].map(String);data=dl?rows:rows.slice(1);
 const h=hdr.map(x=>x.toLowerCase());
 let ph=h.map((x,i)=>/phone|mobile|whatsapp|cell|tel|number|mob/.test(x)&&!/name/.test(x)?i:-1).filter(i=>i>=0);
 if(!ph.length){let b=-1,sc=0;hdr.forEach((_,c)=>{const s=data.slice(0,60).filter(r=>{const n=String(r[c]??'').replace(/\D/g,'').length;return n>=8&&n<=15}).length;if(s>sc){sc=s;b=c}});if(b>=0)ph=[b]}
 let n=h.findIndex(x=>/^(full|first|client|customer|lead)?\s*name/.test(x));if(n<0)n=h.findIndex(x=>/name/.test(x));
 if(n<0)n=hdr.findIndex((_,c)=>c!==ph[0]&&data.slice(0,20).some(r=>/\p{L}{2}/u.test(String(r[c]??''))));
 const fill=(id,v)=>{$(id).innerHTML='<option value="-1">— none —</option>'+hdr.map((x,i)=>`<option value="${i}">${x.replace(/</g,'&lt;')}</option>`).join('');$(id).value=v};
 fill('mn',n);fill('m1',ph[0]??-1);fill('m2',ph[1]??-1);$('adj').hidden=false;
 if(ph.length||$('m1').value!=='-1')clean();else{$('adj').open=true;say('<span class="chip">⚠️ Couldn’t find a phone column – pick it below.</span>')}}
function clean(){
 const nc=+$('mn').value,p1=+$('m1').value,p2=+$('m2').value,cc=$('cc').value.replace(/\D/g,'')||'971';
 if(p1<0&&p2<0)return say('<span class="chip">⚠️ Pick a phone column.</span>');
 const seen=new Set(),out=[],bad=[];let dup=0;
 data.forEach((r,i)=>{const nm=nc>=0?firstName(r[nc]):'';let ok=null,why='no phone';
  for(const c of [p1,p2]){if(c<0||ok)continue;for(const part of String(r[c]??'').split(/[\/;,|\n]+/)){if(!part.trim())continue;const x=normOne(part,cc);if(x.p){ok=x.p;break}why=x.e}}
  if(!ok){bad.push(`Row ${i+2}: ${nm||'(no name)'} – ${why}`);return}
  if(seen.has(ok)){dup++;return}seen.add(ok);out.push({n:nm,p:ok})});
 L=out;ls.set('wa_list',L);
 say(`<span class="chip ok">✅ ${out.length} ready</span><span class="chip">♻️ ${dup} duplicates removed</span><span class="chip">⚠️ ${bad.length} skipped</span>`);
 $('bad').innerHTML=bad.slice(0,200).map(x=>x.replace(/</g,'&lt;')).join('<br>');$('badbox').hidden=!bad.length;render()}
$('rc').onclick=clean;

/* ---- sender ---- */
const msg=$('msg'),sv=ls.get('wa_msg3',null);if(sv)msg.value=sv;msg.oninput=()=>ls.set('wa_msg3',msg.value);
$('mode').value=ls.get('wa_mode','app');$('mode').onchange=()=>ls.set('wa_mode',$('mode').value);
const tg=()=>$('mode').value==='web'?'wa':'_blank';
const link=c=>{const t=encodeURIComponent(msg.value.split('{name}').join(c.n||'there')),k=$('mode').value;
 return k==='app'?'whatsapp://send?phone='+c.p+'&text='+t:k==='web'?'https://web.whatsapp.com/send?phone='+c.p+'&text='+t:'https://wa.me/'+c.p+'?text='+t};
const go=c=>{const a=document.createElement('a');a.href=link(c);a.target=tg();document.body.append(a);a.click();a.remove()};
function render(){
 $('app').hidden=!L.length;if(!L.length)return;
 const q=$('q').value.toLowerCase(),h=$('hide').checked,list=$('list');list.textContent='';
 L.forEach(c=>{if(h&&sent[c.p])return;if(q&&!(c.n.toLowerCase().includes(q)||c.p.includes(q)))return;
  const r=document.createElement('div');r.className='row'+(sent[c.p]?' done':'');
  const av=document.createElement('div');av.className='av';av.textContent=(c.n||'#')[0].toUpperCase();av.style.background='hsl('+(parseInt(c.p.slice(-4))%360)+' 50% 42%)';
  const t=document.createElement('div');t.className='t';const b=document.createElement('b'),s=document.createElement('span');b.textContent=c.n||'(no name)';s.className='mu';s.textContent='+'+c.p;t.append(b,s);
  const a=document.createElement('a');a.className='go';a.textContent=sent[c.p]?'Resend':'Send';
  a.onmousedown=a.ontouchstart=()=>{a.href=link(c);a.target=tg()};
  a.onclick=()=>{a.href=link(c);sent[c.p]=1;ls.set('wa_sent',sent);r.classList.add('done');a.textContent='Resend';stats()};
  r.append(av,t,a);list.append(r)});stats()}
function stats(){const s=L.filter(c=>sent[c.p]).length;$('stats').textContent=s+' of '+L.length+' sent · '+(L.length-s)+' to go';$('pg').style.width=(L.length?s/L.length*100:0)+'%'}
$('next').onclick=()=>{const c=L.find(x=>!sent[x.p]);if(!c)return alert('All done! 🎉');go(c);sent[c.p]=1;ls.set('wa_sent',sent);render()};
$('reset').onclick=()=>{if(confirm('Clear all sent marks?')){sent={};ls.set('wa_sent',sent);render()}};
$('dl').onclick=()=>{const csv='\ufeffName,Phone\n'+L.map(c=>'"'+c.n.replace(/"/g,'""')+'",'+c.p).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cleaned-leads.csv';a.click()};
$('q').oninput=$('hide').onchange=render;render();
</script></body></html>
